databases:
  - name: todo-db
    databaseName: todo
    user: todo

services:
  - type: web
    name: todo-app
    runtime: python
    buildCommand: >
      cd frontend && npm ci && npm run build &&
      cd ../backend && pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: cd backend && python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: NODE_VERSION
        value: "22"
